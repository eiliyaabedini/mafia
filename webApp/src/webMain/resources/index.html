<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#10100f">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="یک میز، هفت بازیکن و رازی که باید کشف شود. مافیا را کنار شخصیت‌های هوش مصنوعی بازی کن.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="مافیای هوش مصنوعی">
    <title>مافیای هوش مصنوعی</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <link rel="preload" href="fonts/vazirmatn.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main id="webApp" aria-label="مافیای هوش مصنوعی"></main>
    <section id="boot-screen" class="boot-screen" aria-labelledby="boot-title" aria-busy="true">
        <div class="boot-card">
            <img class="brand-icon" src="icons/icon-192.png" width="88" height="88" alt="">
            <p class="eyebrow">&#x202B;شب نزدیک است&#x202C;</p>
            <h1 id="boot-title">&#x202B;مافیای هوش مصنوعی&#x202C;</h1>
            <p id="boot-description" class="description">&#x202B;جای تو دور این میز خالی است.&#x202C;</p>
            <div id="boot-progress" class="progress" aria-hidden="true"><span></span></div>
            <p id="boot-status" class="status" role="status" aria-live="polite">&#x202B;در حال آماده‌کردن میز بازی…&#x202C;</p>
            <button id="boot-retry" type="button" hidden>&#x202B;تلاش دوباره&#x202C;</button>
        </div>
    </section>
    <noscript>
        <style>#boot-screen { display: none; }</style>
        <section class="boot-screen"><div class="boot-card">
            <img class="brand-icon" src="icons/icon-192.png" width="88" height="88" alt="">
            <h1>&#x202B;برای بازی، جاوااسکریپت را روشن کن&#x202C;</h1>
            <p class="description">&#x202B;جاوااسکریپت را در تنظیمات مرورگرت فعال کن و این صفحه را دوباره باز کن.&#x202C;</p>
        </div></section>
    </noscript>
    <!-- Vercel Web Analytics: anonymous visitors and page views only. -->
    <script>
        (() => {
            window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
            const inject = () => {
                if (document.querySelector('script[src="/_vercel/insights/script.js"]')) return;
                const script = document.createElement('script');
                script.defer = true;
                script.src = '/_vercel/insights/script.js';
                script.dataset.sdkn = '@vercel/analytics';
                script.dataset.sdkv = '2.0.1';
                document.head.appendChild(script);
            };
            const hasOAuthSecret = () => {
                const query = new URLSearchParams(location.search);
                return query.has('code') || query.has('state');
            };
            if (!hasOAuthSecret()) inject();
            else {
                const deadline = Date.now() + 30_000;
                const timer = setInterval(() => {
                    if (!hasOAuthSecret()) { clearInterval(timer); inject(); }
                    else if (Date.now() >= deadline) clearInterval(timer);
                }, 250);
            }
        })();
    </script>
    <script src="boot.js"></script>
    <script src="ai-bridge.js" defer></script>
    <script src="webApp.js" defer></script>
</body>
</html>
